<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escalio - Plantões e Ganhos</title>
  <meta name="description" content="Escalio: registre seus plantões e saiba quanto faturou no mês. Funciona sem conta.">
  <style>
    :root {
      --navy: #1C2E4E;
      --green: #23A57C;
      --background: #F5F6F8;
      --surface: #FFFFFF;
      --text-secondary: #4B5563;
      --border: #E5E7EB;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      background: var(--background);
      color: var(--navy);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    h1 { margin: 0 0 6px; font-size: 30px; }
    p { color: var(--text-secondary); line-height: 1.6; margin: 0 0 24px; }
    a.button {
      display: block;
      text-decoration: none;
      font-weight: 600;
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
      color: var(--navy);
    }
    a.button:hover { border-color: var(--green); color: var(--green); }
  </style>
</head>
<body>
  <div class="card">
    <h1>Escalio</h1>
    <p>Registre seus plantões e saiba quanto faturou no mês. Funciona sem conta: a conta é só o seu backup.</p>
    <a class="button" href="termos-de-uso.html">Termos de Uso</a>
    <a class="button" href="politica-de-privacidade.html">Política de Privacidade</a>
  </div>
</body>
</html>
